name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Built page is up to date
        run: |
          python3 build.py
          git diff --exit-code -- dist/index.html || (echo "::error::dist/index.html is stale. Run python3 build.py and commit the result." && exit 1)

      - name: Content-integrity tests
        run: node --test tests/*.test.mjs

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser smoke test
        run: python3 tests/smoke_test.py
